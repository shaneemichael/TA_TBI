[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nya-ir-study"
version = "0.1.0"
description = "Indonesian -nya preprocessing experiments for MIRACL-id information retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maskrio" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "statsmodels>=0.14,<1",
    "PyYAML>=6.0,<7",
    "tomli>=2.0,<3; python_version<'3.11'",
]

[project.optional-dependencies]
bm25 = ["pyserini>=0.21"]
dense = [
    "faiss-cpu>=1.8",
    "sentence-transformers>=2.7",
    "torch>=2.2",
]
preprocessing = [
    "PySastrawi>=1.2",
    "stanza>=1.8",
]
data = ["datasets>=2.19"]
eval = ["pytrec-eval>=0.5"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
all = [
    "pyserini>=0.21",
    "faiss-cpu>=1.8",
    "sentence-transformers>=2.7",
    "torch>=2.2",
    "PySastrawi>=1.2",
    "stanza>=1.8",
    "datasets>=2.19",
    "pytrec-eval>=0.5",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
nya-verify-preprocessing = "nya_ir.cli.verify_preprocessing:main"
nya-prepare-miracl = "nya_ir.cli.prepare_miracl:main"
nya-build-index = "nya_ir.cli.build_index:main"
nya-run-retrieval = "nya_ir.cli.run_retrieval:main"
nya-evaluate-runs = "nya_ir.cli.evaluate_runs:main"
nya-analyze-results = "nya_ir.cli.analyze_results:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
