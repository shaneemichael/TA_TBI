[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nya-ir-study"
version = "0.1.0"
description = "Indonesian -nya preprocessing experiments for MIRACL-id information retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maskrio" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "statsmodels>=0.14,<1",
    "matplotlib>=3.8,<4",
    "PyYAML>=6.0,<7",
    "tomli>=2.0,<3; python_version<'3.11'",
]

[project.optional-dependencies]
bm25 = ["pyserini>=0.21"]
dense = [
    "faiss-cpu>=1.8",
    "FlagEmbedding>=1.3,<2",
    "torch>=2.2",
]
preprocessing = [
    "PySastrawi>=1.2",
    "stanza>=1.8",
]
# Pin datasets<4.0: MIRACL is a script-based dataset (miracl.py loader) and
# datasets>=4.0 removed script-based loading entirely. The error message that
# surfaces ("remove trust_remote_code") is misleading — the flag was the gate
# for the deleted feature, not the cause. Lift the upper bound only after
# MIRACL is re-published as Parquet or we migrate to direct hf_hub_download.
data = ["datasets>=2.19,<4.0"]
eval = ["pytrec-eval>=0.5"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
all = [
    "pyserini>=0.21",
    "faiss-cpu>=1.8",
    "FlagEmbedding>=1.3,<2",
    "torch>=2.2",
    "matplotlib>=3.8,<4",
    "PySastrawi>=1.2",
    "stanza>=1.8",
    "datasets>=2.19,<4.0",  # see [data] above — MIRACL is script-based, datasets>=4.0 removed scripts
    "pytrec-eval>=0.5",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
nya-verify-preprocessing = "nya_ir.cli.verify_preprocessing:main"
nya-prepare-miracl = "nya_ir.cli.prepare_miracl:main"
nya-extract-qrels = "nya_ir.cli.extract_qrels:main"
nya-score-sensitivity = "nya_ir.cli.score_sensitivity:main"
nya-build-index = "nya_ir.cli.build_index:main"
nya-run-retrieval = "nya_ir.cli.run_retrieval:main"
nya-evaluate-runs = "nya_ir.cli.evaluate_runs:main"
nya-analyze-results = "nya_ir.cli.analyze_results:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
